            application/atom+xml:
              schema:
                $ref: '#/components/schemas/BwValidationFeed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: 'Method not supported. On the captured a4h system this resource

